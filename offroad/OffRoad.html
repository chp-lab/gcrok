<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Off Road</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%99%3C/text%3E%3C/svg%3E">
<style>
/* Off Road — dark, high-contrast, near-zero animation (ประหยัดแบต/จอ OLED) */
:root {
  --bg: #000; --surface: #0d0d10; --surface2: #17171c; --line: #2a2a32;
  --text: #ececf0; --muted: #9a9aa6;
  --ok: #3ddc84; --warn: #ffb020; --crit: #ff5a5f; --info: #4da3ff;
  --yellow: #ffd60a; --orange: #ff8a1f; --red: #ff3b30;
  --radius: 10px;
  --font: "Segoe UI", "Leelawadee UI", "Noto Sans Thai", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { color-scheme: dark; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); }
h1, h2, h3 { margin: 0; font-weight: 600; }
a { color: var(--info); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }

/* layout */
.shell { display: grid; grid-template-columns: 200px 1fr; min-height: 100vh; }
nav { background: var(--surface); border-right: 1px solid var(--line); padding: 14px 10px; position: sticky; top: 0; height: 100vh; }
nav .brand { font-size: 20px; font-weight: 700; padding: 4px 10px 14px; }
nav .brand small { display: block; font-size: 11px; font-weight: 400; color: var(--muted); }
nav a { display: block; padding: 9px 12px; border-radius: 8px; color: var(--text); text-decoration: none; }
nav a:hover { background: var(--surface2); }
nav a.active { background: var(--surface2); box-shadow: inset 3px 0 0 var(--info); }
main { padding: 16px 20px 60px; min-width: 0; }
header.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
header.top h1 { font-size: 22px; }
header.top .spacer { flex: 1; }
.clock { font-variant-numeric: tabular-nums; color: var(--muted); }
@media (max-width: 820px) {
  .shell { grid-template-columns: 1fr; }
  nav { position: static; height: auto; display: flex; gap: 4px; overflow-x: auto; padding: 8px; border-right: 0; border-bottom: 1px solid var(--line); }
  nav .brand { display: none; }
  nav a { white-space: nowrap; }
  main { padding: 12px 16px 60px; }
}

/* cards & grid */
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.grid.wide { grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; min-width: 0; }
.card > h2 { font-size: 13px; letter-spacing: .04em; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card.span2 { grid-column: 1 / -1; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.big { font-size: 34px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.gap { gap: 8px; }
.mt { margin-top: 12px; }

/* status colours */
.ok { color: var(--ok); } .warn { color: var(--warn); } .crit { color: var(--crit); } .info { color: var(--info); }
.chip { display: inline-block; padding: 1px 9px; border-radius: 99px; font-size: 12px; border: 1px solid var(--line); background: var(--surface2); white-space: nowrap; }
.chip.ok { border-color: #1f6b43; } .chip.warn { border-color: #7a5410; } .chip.crit { border-color: #8a2a2d; } .chip.info { border-color: #1f4f80; }
.flag { display: inline-flex; align-items: center; gap: 8px; padding: 4px 14px; border-radius: 99px; font-weight: 700; color: #000; }
.flag.yellow { background: var(--yellow); } .flag.orange { background: var(--orange); } .flag.red { background: var(--red); color: #fff; }

/* meters */
.bar { height: 8px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--ok); }
.bar.warn > i { background: var(--warn); } .bar.crit > i { background: var(--crit); } .bar.info > i { background: var(--info); }
.ring { position: relative; width: 132px; height: 132px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { stroke: var(--surface2); } .ring .val { stroke: var(--ok); stroke-linecap: round; }
.ring.warn .val { stroke: var(--warn); } .ring.crit .val { stroke: var(--crit); }
.ring .label { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .label b { font-size: 26px; font-variant-numeric: tabular-nums; }
.spark { display: flex; align-items: flex-end; gap: 6px; height: 74px; }
.spark div { flex: 1; text-align: center; font-size: 11px; color: var(--muted); display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
.spark span { display: block; background: var(--info); border-radius: 3px 3px 0 0; min-height: 2px; }
.spark span.low { background: var(--crit); }

/* lists / tables */
.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: 7px 0; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: baseline; }
.list li:last-child { border-bottom: 0; }
.list .grow { flex: 1; min-width: 0; }
.list time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.group td { background: var(--surface2); font-weight: 600; }

/* controls */
input, select, textarea { background: var(--surface2); border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; min-width: 0; }
input[type=number] { width: 90px; }
input[type=time] { width: 112px; }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--info); }
input.wide, textarea { width: 100%; }
td input:not([type=checkbox]), td select { width: 100%; min-width: 70px; }
td input[type=number], td input[type=time], td input[type=date] { max-width: 120px; }
td { white-space: nowrap; }
td:has(> input:not([type=number]):not([type=checkbox]):not([type=time]):not([type=date])) { white-space: normal; }
button { background: var(--surface2); border: 1px solid var(--line); border-radius: 7px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button.primary { background: #123a63; border-color: #1f5f9f; }
button.danger { color: var(--crit); }
button.sm { padding: 2px 8px; font-size: 13px; }
button.seg.on { background: #123a63; border-color: var(--info); }
button.seg[data-flag=yellow].on { background: var(--yellow); color: #000; border-color: var(--yellow); }
button.seg[data-flag=orange].on { background: var(--orange); color: #000; border-color: var(--orange); }
button.seg[data-flag=red].on { background: var(--red); color: #fff; border-color: var(--red); }
form.inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* checklist */
.check { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
.check.done span.t { color: var(--muted); text-decoration: line-through; }
.check .t { flex: 1; cursor: pointer; }

/* knowledge base */
.kbgrid { display: grid; grid-template-columns: 320px 1fr; gap: 14px; }
@media (max-width: 900px) { .kbgrid { grid-template-columns: 1fr; } }
.doclink { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 8px 4px; }
.doclink:hover, .doclink.active { background: var(--surface2); }
.doclink .snip { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
mark { background: #6b5200; color: #fff; border-radius: 2px; }
.md h1 { font-size: 22px; margin: 0 0 10px; } .md h2 { font-size: 18px; margin: 18px 0 8px; } .md h3 { font-size: 16px; margin: 14px 0 6px; }
.md p { margin: 8px 0; } .md ul, .md ol { padding-left: 22px; margin: 8px 0; } .md li.task { list-style: none; margin-left: -22px; }
.md code { background: var(--surface2); padding: 1px 5px; border-radius: 4px; }
.md pre { background: var(--surface2); padding: 10px; border-radius: 8px; overflow-x: auto; }
.md blockquote { margin: 10px 0; padding: 4px 12px; border-left: 3px solid var(--warn); background: var(--surface2); }
.md table { margin: 10px 0; } .md th, .md td { border: 1px solid var(--line); }
.md hr { border: 0; border-top: 1px solid var(--line); }
iframe.doc { width: 100%; height: 72vh; border: 1px solid var(--line); border-radius: 8px; background: #fff; }

/* toast */
#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--surface2); border: 1px solid var(--line); padding: 8px 16px; border-radius: 99px; opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 9; }
#toast.show { opacity: 1; } #toast.err { border-color: var(--crit); color: var(--crit); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* โหมดไฟล์เดียว */
body.local .js-reindex { display: none; }
nav .navtools { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line); display: grid; gap: 6px; }
nav .navtools button { text-align: left; font-size: 13px; }
nav .navtools .status { font-size: 11px; color: var(--muted); padding: 2px 4px; }
.kbtools { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
@media (max-width: 820px) { nav .navtools { display: none; } }

/* กล่องโต้ตอบ */
dialog.dlg { background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; width: min(560px, calc(100vw - 32px)); }
dialog.dlg::backdrop { background: rgba(0, 0, 0, .7); }
dialog.dlg p { margin: 0 0 12px; }
dialog.dlg textarea { width: 100%; min-height: 220px; font: 12px/1.4 ui-monospace, Consolas, monospace; }
.row.end { justify-content: flex-end; }

</style>
</head>

,"title":"แผนผังไฟฟ้า / เบรกเกอร์","kind":"md","category":"infrastructure","content":"# แผนผังไฟฟ้า / เบรกเกอร์\n\n> เทมเพลต: เติมให้ตรงกับบ้านจริง และติดป้ายที่ตู้เบรกเกอร์ด้วย\n\n## ลำดับการตัดไฟ (เฟส 2)\n1. ปิดเบรกเกอร์ย่อยของวงจร **ชั้น 1** ทั้งหมด (ปลั๊ก, แอร์, เครื่องทำน้ำอุ่น)\n2. ปิดเมนเบรกเกอร์ถ้าน้ำใกล้ถึงระดับปลั๊ก/มิเตอร์\n3. ถอดปลั๊กอุปกรณ์ชั้น 1 และยกขึ้นที่สูง\n4. บันทึกเวลาที่ตัดไฟในบันทึกเหตุการณ์\n\n> ⚠ ห้ามแตะสวิตช์/เบรกเกอร์เมื่อมือเปียกหรือยืนในน้ำ — ถ้าตัดไม่ทันและน้ำท่วมแล้ว ห้ามลุยเข้าไปตัด\n\n## ตารางวงจร\n| เบรกเกอร์ | วงจร | ชั้น | ตัดในเฟส |\n|---|---|---|---|\n| (กรอก) | ปลั๊กห้องนั่งเล่น | 1 | 2 |\n| (กรอก) | ปลั๊กห้องนอน | 2 | — |\n\n## Power Station + โซลาร์ (ชั้น 2)\n- Power Station 2 kWh · แผงโซลาร์ 650 W\n- จ่ายไฟแยกจากระบบบ้าน ห้ามต่อย้อนเข้าสายบ้าน\n"},{"id":3,"path":"infrastructure/water_tank_piping.md","title":"ถังน้ำดาดฟ้า & ท่อ Gravity-feed","kind":"md","category":"infrastructure","content":"# ถังน้ำดาดฟ้า & ท่อ Gravity-feed\n\n## แนวทาง\n- ถังบนดาดฟ้าส่งน้ำลงสู่ชั้น 2 ด้วยแรงโน้มถ่วง ไม่ต้องใช้ปั๊มไฟฟ้า\n- ก่อนน้ำท่วม: **ปิดวาล์วท่อชั้น 1** เพื่อกันน้ำปนเปื้อนไหลย้อน\n\n## ตำแหน่งวาล์ว (กรอก)\n| วาล์ว | ตำแหน่ง | หน้าที่ |\n|---|---|---|\n| V1 | (กรอก) | ประปาเข้าบ้าน |\n| V2 | (กรอก) | ท่อชั้น 1 |\n| V3 | (กรอก) | ถัง → ชั้น 2 |\n\n## การใช้น้ำ\n1. น้ำจากถัง = น้ำใช้ (ล้าง/ชำระ) ต้อง **ต้ม/กรอง** ก่อนดื่ม\n2. น้ำดื่มใช้ขวดสำรองก่อน\n3. ปิดฝาถัง กันยุงและสิ่งสกปรก\n"},{"id":4,"path":"medical/medical_checklist.md","title":"Emergency First Aid & Medication Checklist","kind":"md","category":"medical","content":"# Emergency First Aid & Medication Checklist\n\n> ⚠ เอกสารตัวอย่าง (เทมเพลต) — รายการยาและขนาดยาให้ปรึกษาแพทย์/เภสัชกรก่อน แล้วกรอกให้ตรงกับสมาชิกในบ้านจริง\n> ฉุกเฉินทางการแพทย์โทร **1669** (ถ้ามีสัญญาณ)\n\n## ชุดปฐมพยาบาล\n- [ ] ผ้าก๊อซ / ผ้าพันแผล / พลาสเตอร์\n- [ ] น้ำยาล้างแผล / แอลกอฮอล์ / เบตาดีน\n- [ ] ถุงมือยาง หน้ากากอนามัย\n- [ ] เทอร์โมมิเตอร์ ไฟฉายคาดหัว\n- [ ] เกลือแร่ ORS\n- [ ] ครีมแก้แพ้/กันยุง ครีมทาผิวหนังจากการแช่น้ำ\n\n## ยาประจำตัวของสมาชิก\n| สมาชิก | โรคประจำตัว / ยา | จำนวนวันที่มี | หมายเหตุ |\n|---|---|---|---|\n| (กรอก) | | | |\n\n## สัญญาณอันตราย — ต้องขอความช่วยเหลือ\n- ไข้สูงต่อเนื่อง ซึม สับสน\n- ท้องเสียรุนแรง/ขาดน้ำ\n- แผลบวมแดงร้อน มีหนอง (ติดเชื้อจากน้ำท่วม)\n- หายใจลำบาก เจ็บหน้าอก\n"},{"id":5,"path":"medical/pharmacy_order_list.md","title":"Pharmacy Order List (รายการยา/เวชภัณฑ์ที่ต้องเตรียม)","kind":"md","category":"medical","content":"# Pharmacy Order List (รายการยา/เวชภัณฑ์ที่ต้องเตรียม)\n\n> เทมเพลต: กรอกชื่อยาตามที่แพทย์/เภสัชกรแนะนำ\n\n| รายการ | จำนวน | จำเป็นระดับ | สั่งแล้ว |\n|---|---|---|---|\n| ORS ผงเกลือแร่ | (กรอก) | สูง | ☐ |\n| ยาประจำตัวสมาชิก (สำรอง 14 วัน) | (กรอก) | สูง | ☐ |\n| ชุดทำแผล | (กรอก) | สูง | ☐ |\n| เม็ด/น้ำยาฆ่าเชื้อน้ำ | (กรอก) | สูง | ☐ |\n| ยากันยุง / ทากันแมลง | (กรอก) | กลาง | ☐ |\n"},{"id":6,"path":"sanitation/urban_bushcraft_sanitation.md","title":"สุขาภิบาลและการอยู่รอดในเมือง","kind":"md","category":"sanitation","content":"# สุขาภิบาลและการอยู่รอดในเมือง\n\n## ส้วมแห้ง (Dry Latrine)\n1. ตั้งที่นั่งไม้อัด/ถังพลาสติก วางถุงหนา **สองชั้น** ในถัง\n2. หลังใช้ทุกครั้งโรย **ปูนขาวหรือขี้เลื่อย** ให้คลุมของเสีย\n3. เมื่อถุงเต็ม 2/3 รัดปากแน่น 2 ชั้น เก็บในถังมีฝาปิดไว้ที่ระเบียง ห่างอาหาร/น้ำ\n4. ล้างมือด้วยสบู่หรือเจลแอลกอฮอล์ทุกครั้ง\n5. บันทึกจำนวนถุงที่เก็บไว้ในบันทึกเหตุการณ์\n\n## ทำน้ำดื่มให้ปลอดภัย\n1. ปล่อยให้ตะกอนตก/กรองผ่านผ้าสะอาด\n2. **ต้มให้เดือดพล่านอย่างน้อย 1 นาที** (ใช้แก๊สประหยัด: ต้มครั้งละมาก ๆ)\n3. หรือใช้เม็ด/น้ำยาฆ่าเชื้อตามฉลากของผู้ผลิต\n4. เก็บในภาชนะสะอาดมีฝาปิด\n\n## ครัวระเบียง\n- ใช้เตาแก๊สพกพาในที่โล่ง ระบายอากาศดี ห้ามใช้ในห้องปิด\n- ปิดวาล์วแก๊สทุกครั้งหลังใช้ เก็บกระป๋องแก๊สห่างความร้อน\n"}],"next":{"supplies":7,"loads":7,"devices":11,"sims":6,"schedules":21,"items":24,"events":1,"kb":6,"supply_log":0,"power_log":0}};

  // ───────────── storage ─────────────
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(db)); persistOK = true; } catch { persistOK = false; }
    status();
  }
  function load() {
    try { const raw = localStorage.getItem(KEY); if (raw) { db = JSON.parse(raw); return; } } catch { persistOK = false; }
    db = JSON.parse(JSON.stringify(window.OFFROAD_SEED));
    persist();
  }
  load();
  window.addEventListener('storage', e => { if (e.key === KEY && e.newValue) db = JSON.parse(e.newValue); });  // แท็บอื่นแก้ไข

  const nid = t => (db.next[t] = (db.next[t] || 0) + 1);
  const nowIso = () => new Date().toISOString();
  const err = (code) => { const e = new Error(code); throw e; };
  const clone = o => JSON.parse(JSON.stringify(o));
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const isoMin = d => d ? `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}` : null;
  const setting = (k, def) => (db.settings[k] ?? def);

  // ───────────── validation (เทียบเท่า CHECK ใน schema.sql) ─────────────
  const ENUM = {
    category: ['water', 'food', 'gas', 'fuel'], kind_dev: ['phone', 'tablet', 'laptop', 'pc'],
    power_state: ['on', 'off', 'charging', 'standby'], actual_state: ['on', 'off'], carrier: ['AIS', 'True'],
    condition: ['sunny', 'partly', 'cloudy', 'rain', 'storm'], kind_sched: ['sim_power', 'hotspot'],
    kind_ev: ['water_gate', 'water_indoor', 'breaker', 'solar', 'power', 'supply', 'health', 'comms', 'note'],
  };
  const RANGE = { soc_pct: [0, 100], reserve_pct: [0, 100], inverter_eff: [0.3, 1], solar_derate: [0, 1], battery_pct: [0, 100],
    battery_health_pct: [0, 100], hours_per_day: [0, 24], qty_initial: [0, 1e12], qty_remaining: [0, 1e12], daily_use: [0, 1e12],
    watts: [0, 1e12], solar_peak_w: [0, 1e12], peak_sun_hours: [0, 24], capacity_wh: [1e-9, 1e12] };
  const TIME = /^[0-2]\d:[0-5]\d$/, DAYS = /^[01]{7}$/;

  // spec: field -> 'str' | 'str?' | 'float' | 'int?' | 'bool' | ['enum', รายการค่าที่ยอมรับ]
  function P(body, spec) {
    const out = {};
    for (const [k, t] of Object.entries(spec)) {
      if (!(k in body)) continue;
      let v = body[k];
      if (t === 'str') v = String(v ?? '').trim();
      else if (t === 'str?') v = (v === null || v === '') ? null : String(v).trim();
      else if (t === 'bool') v = (v === true || v === 1 || v === '1' || v === 'true') ? 1 : 0;
      else if (t === 'float' || t === 'int?') {
        if (t === 'int?' && (v === null || v === '')) v = null;
        else { v = Number(v); if (!Number.isFinite(v)) err('bad_number'); if (t === 'int?') v = Math.trunc(v); }
      } else if (Array.isArray(t) && !t[1].includes(v)) err('constraint_failed');
      if (RANGE[k] && v !== null && (v < RANGE[k][0] || v > RANGE[k][1])) err('constraint_failed');
      if ((k === 'start_hhmm' || k === 'end_hhmm') && !TIME.test(v)) err('constraint_failed');
      if (k === 'days' && !DAYS.test(v)) err('constraint_failed');
      out[k] = v;
    }
    return out;
  }
  const SPEC = {
    supply: { category: ['enum', ENUM.category], name: 'str', unit: 'str', qty_initial: 'float', qty_remaining: 'float', daily_use: 'float', note: 'str?' },
    station: { name: 'str', capacity_wh: 'float', soc_pct: 'float', reserve_pct: 'float', inverter_eff: 'float', solar_peak_w: 'float', solar_derate: 'float', peak_sun_hours: 'float' },
    load: { name: 'str', watts: 'float', hours_per_day: 'float', enabled: 'bool', note: 'str?' },
    device: { name: 'str', kind: ['enum', ENUM.kind_dev], model: 'str?', role: 'str?', battery_pct: 'int?', battery_health_pct: 'int?', power_state: ['enum', ENUM.power_state], note: 'str?' },
    sim: { carrier: ['enum', ENUM.carrier], label: 'str', msisdn: 'str?', device_id: 'int?', actual_state: ['enum', ENUM.actual_state], expires_on: 'str?', note: 'str?' },
    sched: { kind: ['enum', ENUM.kind_sched], sim_id: 'int?', device_id: 'int?', start_hhmm: 'str', end_hhmm: 'str', days: 'str', enabled: 'bool' },
  };
  const findIn = (arr, id) => arr.find(x => x.id === id) || err('not_found');
  const del = (arr, id) => { const i = arr.findIndex(x => x.id === id); if (i < 0) err('not_found'); arr.splice(i, 1); return { ok: true }; };
  function mustRows(vals, req) { for (const k of req) if (vals[k] == null || vals[k] === '') err(`missing_${k}`); }

  // ───────────── calc (พอร์ตจาก calc.py) ─────────────
  const FACTOR = { sunny: 1.0, partly: 0.6, cloudy: 0.3, rain: 0.15, storm: 0.05 };

  function summarizeSupplies(rows, warn, crit) {
    const cats = {};
    for (const r of rows) {
      const c = cats[r.category] || (cats[r.category] = { category: r.category, items: [], days: null });
      const it = { ...r, days: r.daily_use > 0 ? r.qty_remaining / r.daily_use : null,
        pct: r.qty_initial > 0 ? Math.min(100, 100 * r.qty_remaining / r.qty_initial) : null };
      c.items.push(it);
      if (it.days != null) c.days = (c.days || 0) + it.days;
    }
    return Object.values(cats).map(c => ({ ...c, status: c.days == null ? 'unknown' : c.days < crit ? 'crit' : c.days < warn ? 'warn' : 'ok' }));
  }
  const solarWh = (st, cond) => st.solar_peak_w * st.solar_derate * st.peak_sun_hours * (FACTOR[cond] ?? FACTOR.cloudy);
  const dailyLoad = loads => loads.reduce((a, l) => a + (l.enabled ? l.watts * l.hours_per_day : 0), 0);

  function simulatePower(st, loads, forecast, today, def, horizon = 14) {
    const cap = st.capacity_wh, reserve = cap * st.reserve_pct / 100, stored = cap * st.soc_pct / 100;
    const load = dailyLoad(loads), burn = load / st.inverter_eff;
    let energy = stored, remaining = null; const days = [];
    for (let i = 0; i < horizon; i++) {
      const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() + i), day = ymd(d);
      const cond = forecast[day] || def, sol = solarWh(st, cond), start = energy;
      energy = Math.min(cap, energy + sol - burn);
      days.push({ day, condition: cond, solar_wh: Math.round(sol), burn_wh: Math.round(burn), end_wh: Math.round(Math.max(energy, 0)),
        end_pct: Math.round(Math.max(energy, 0) / cap * 1000) / 10 });
      if (remaining === null && energy <= reserve) {
        const net = sol - burn, frac = (net < 0 && start > reserve) ? (start - reserve) / -net : 0;
        remaining = i + Math.max(0, Math.min(1, frac));
        energy = Math.max(energy, 0);
      }
    }
    return { stored_wh: Math.round(stored), reserve_wh: Math.round(reserve), load_wh_day: Math.round(load), burn_wh_day: Math.round(burn),
      days, days_remaining: remaining, sustainable: remaining === null };
  }

  const mins = s => { const [h, m] = s.split(':'); return +h * 60 + +m; };
  function windowState(windows, now = new Date()) {
    const ws = windows.filter(w => w.enabled), spans = [];
    for (let off = -1; off < 8; off++) {
      const day = new Date(now.getFullYear(), now.getMonth(), now.getDate() + off), wd = (day.getDay() + 6) % 7;   // จันทร์ = 0
      for (const w of ws) {
        if (w.days[wd] !== '1') continue;
        const s = new Date(day.getFullYear(), day.getMonth(), day.getDate(), 0, mins(w.start_hhmm));
        let e = new Date(day.getFullYear(), day.getMonth(), day.getDate(), 0, mins(w.end_hhmm));
        if (e <= s) e = new Date(e.getFullYear(), e.getMonth(), e.getDate() + 1, e.getHours(), e.getMinutes());
        spans.push([s, e]);
      }
    }
    spans.sort((a, b) => a[0] - b[0]);
    const merged = [];
    for (const [s, e] of spans) {
      if (merged.length && s <= merged[merged.length - 1][1]) { const m = merged[merged.length - 1]; if (e > m[1]) m[1] = e; }
      else merged.push([s, e]);
    }
    for (const [s, e] of merged) if (s <= now && now < e) return { active: true, next_change: e, has_schedule: true };
    const future = merged.map(m => m[0]).filter(s => s > now);
    return { active: false, next_change: future.length ? future[0] : null, has_schedule: ws.length > 0 };
  }

  // ───────────── services (พอร์ตจาก services.py) ─────────────
  const CAT_ORDER = { water: 0, food: 1, gas: 2, fuel: 3 };
  function suppliesOverview() {
    const rows = clone(db.supplies).sort((a, b) => CAT_ORDER[a.category] - CAT_ORDER[b.category] || a.id - b.id);
    return summarizeSupplies(rows, +setting('warn_days', 7), +setting('crit_days', 3));
  }
  function powerOverview(horizon = 14) {
    const today = new Date(), todayS = ymd(today);
    const forecast = {};
    for (const [d, c] of Object.entries(db.forecast)) if (d >= todayS) forecast[d] = c;
    const def = setting('solar_default_condition', 'partly');
    const out = simulatePower(db.station, db.loads, forecast, today, def, horizon);
    return { ...out, station: clone(db.station), loads: clone(db.loads), default_condition: def, forecast_days: forecast };
  }
  function fleetOverview() {
    const devices = clone(db.devices).sort((a, b) => a.id - b.id);
    for (const d of devices) d.sims = db.sims.filter(s => s.device_id === d.id).map(s => s.label);
    const by = {}; for (const d of devices) by[d.kind] = (by[d.kind] || 0) + 1;
    return { devices, total: devices.length, by_kind: by,
      low_battery: devices.filter(d => d.battery_pct != null && d.battery_pct < 30 && d.power_state !== 'charging'),
      powered_on: devices.filter(d => d.power_state === 'on' || d.power_state === 'charging').length };
  }
  function simsOverview(now = new Date()) {
    const sims = clone(db.sims).sort((a, b) => a.id - b.id);
    const scheds = clone(db.schedules).sort((a, b) => a.start_hhmm.localeCompare(b.start_hhmm) || a.id - b.id);
    for (const s of sims) {
      const ws = scheds.filter(w => w.kind === 'sim_power' && w.sim_id === s.id), st = windowState(ws, now);
      s.device_name = db.devices.find(d => d.id === s.device_id)?.name ?? null;
      Object.assign(s, { schedule_count: ws.length, scheduled_on: st.active, next_change: isoMin(st.next_change), has_schedule: st.has_schedule,
        mismatch: st.has_schedule && st.active !== (s.actual_state === 'on') });
    }
    const hotspots = [];
    for (const dev of db.devices) {
      const ws = scheds.filter(w => w.kind === 'hotspot' && w.device_id === dev.id);
      if (ws.length) { const st = windowState(ws, now); hotspots.push({ device_id: dev.id, device_name: dev.name, active: st.active, next_change: isoMin(st.next_change) }); }
    }
    return { sims, hotspots, schedules: scheds };
  }
  function checklistsOverview() {
    const phases = clone(db.phases).sort((a, b) => a.level - b.level);
    for (const p of phases) {
      p.items = db.items.filter(i => i.level === p.level).sort((a, b) => a.seq - b.seq || a.id - b.id).map(clone);
      p.done = p.items.filter(i => i.done).length; p.total = p.items.length;
    }
    return { active: +setting('active_phase', 1), phases };
  }
  const sortedEvents = () => [...db.events].sort((a, b) => (a.ts < b.ts ? 1 : a.ts > b.ts ? -1 : b.id - a.id));
  const latestEvent = kind => { const e = sortedEvents().find(x => x.kind === kind && x.value != null); return e ? { ts: e.ts, value: e.value, unit: e.unit, text: e.text } : null; };

  function dashboard() {
    const chk = checklistsOverview(), active = chk.phases.find(p => p.level === chk.active), power = powerOverview(7);
    const fleet = fleetOverview(), so = simsOverview();
    const nexts = so.sims.map(s => s.next_change).filter(Boolean).sort();
    return {
      now: new Date().toISOString(),
      phase: { level: active.level, name: active.name, flag: active.flag, summary: active.summary, done: active.done, total: active.total },
      supplies: suppliesOverview(),
      power: { stored_wh: power.stored_wh, load_wh_day: power.load_wh_day, burn_wh_day: power.burn_wh_day, days: power.days,
        days_remaining: power.days_remaining, sustainable: power.sustainable, soc_pct: power.station.soc_pct, capacity_wh: power.station.capacity_wh },
      fleet: { total: fleet.total, by_kind: fleet.by_kind, low_battery: fleet.low_battery, powered_on: fleet.powered_on },
      sims: { on_now: so.sims.filter(s => s.scheduled_on).map(s => s.label), actual_on: so.sims.filter(s => s.actual_state === 'on').map(s => s.label),
        mismatch: so.sims.filter(s => s.mismatch).map(s => s.label), next_change: nexts[0] || null, hotspots: so.hotspots },
      water: { gate: latestEvent('water_gate'), indoor: latestEvent('water_indoor') },
      events: sortedEvents().slice(0, 8).map(clone),
    };
  }

  // ───────────── knowledge base ─────────────
  const MO = '\x02', MC = '\x03';
  const kbMeta = d => ({ id: d.id, path: d.path, title: d.title, kind: d.kind, category: d.category, size: (d.content || '').length });
  function kbTitle(content, path) { const m = /^#\s+(.+)$/m.exec(content); return m ? m[1].trim() : path.split('/').pop().replace(/\.[^.]+$/, '').replace(/_/g, ' '); }
  function kbList() { return db.kb.map(kbMeta).sort((a, b) => a.category.localeCompare(b.category, 'th') || a.title.localeCompare(b.title, 'th')); }
  function kbSearch(q) {
    const terms = q.trim().split(/\s+/).filter(Boolean).map(t => t.toLowerCase());
    if (!terms.length) return [];
    const out = [];
    for (const d of db.kb) {
      const text = d.kind === 'html' ? d.content.replace(/<script[\s\S]*?<\/script>|<style[\s\S]*?<\/style>|<[^>]+>/g, ' ') : d.content;
      const hay = (d.title + '\n' + text).toLowerCase();
      if (!terms.every(t => hay.includes(t))) continue;
      const lower = text.toLowerCase(), pos = Math.min(...terms.map(t => lower.indexOf(t)).filter(p => p >= 0), Infinity);
      let snip = '';
      if (Number.isFinite(pos)) {
        snip = text.slice(Math.max(0, pos - 60), pos + 120).replace(/\s+/g, ' ');
        for (const t of terms) snip = snip.replace(new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => MO + m + MC);
        snip = (pos > 60 ? '…' : '') + snip + '…';
      }
      out.push({ ...kbMeta(d), snip });
      if (out.length >= 30) break;
    }
    return out;
  }

  // ───────────── router (พอร์ตจาก server.py) ─────────────
  const R = [];
  const route = (m, p, fn) => R.push([m, new RegExp('^' + p + '$'), fn]);
  const ID = m => +m[1];

  route('GET', '/api/meta', () => ({ now: new Date().toISOString(), fts_tokenizer: 'js', lan_urls: [],
    note: 'โหมดไฟล์เดียว: ข้อมูลถูกเก็บไว้ในเบราว์เซอร์เครื่องนี้ (localStorage) ไม่ส่งออกไปไหน — ใช้ปุ่ม “สำรองข้อมูล” ที่เมนูซ้ายเป็นระยะ เพราะการล้างข้อมูลเบราว์เซอร์จะลบข้อมูลนี้' }));
  route('GET', '/api/dashboard', () => dashboard());

  route('GET', '/api/supplies', () => suppliesOverview());
  route('POST', '/api/supplies', (m, q, b) => {
    b = { ...b }; if (!('qty_remaining' in b)) b.qty_remaining = b.qty_initial ?? 0;
    const v = P(b, SPEC.supply); mustRows(v, ['name', 'category', 'unit']);
    const row = { id: nid('supplies'), qty_initial: 0, qty_remaining: 0, daily_use: 0, note: null, ...v, updated_at: nowIso() };
    db.supplies.push(row); return { id: row.id };
  });
  route('PUT', '/api/supplies/(\\d+)', (m, q, b) => { const v = P(b, SPEC.supply); if (!Object.keys(v).length) err('no_fields'); Object.assign(findIn(db.supplies, ID(m)), v, { updated_at: nowIso() }); return { ok: true }; });
  route('DELETE', '/api/supplies/(\\d+)', m => del(db.supplies, ID(m)));
  route('POST', '/api/supplies/(\\d+)/adjust', (m, q, b) => {
    const s = findIn(db.supplies, ID(m)), delta = Number(b.delta);
    if (!Number.isFinite(delta)) err('bad_number');
    const nv = Math.max(0, s.qty_remaining + delta);
    db.supply_log.push({ id: nid('supply_log'), supply_id: s.id, ts: nowIso(), delta: nv - s.qty_remaining, note: String(b.note || '').slice(0, 200) });
    s.qty_remaining = nv; s.updated_at = nowIso(); return { qty_remaining: nv };
  });

  route('GET', '/api/power', () => powerOverview());
  route('PUT', '/api/power/station', (m, q, b) => {
    const v = P(b, SPEC.station);
    if ('default_condition' in b) { if (!ENUM.condition.includes(b.default_condition)) err('bad_condition'); db.settings.solar_default_condition = b.default_condition; }
    if (Object.keys(v).length) {
      Object.assign(db.station, v, { updated_at: nowIso() });
      if ('soc_pct' in v) db.power_log.push({ id: nid('power_log'), ts: nowIso(), soc_pct: v.soc_pct, note: String(b.note || '').slice(0, 200) });
    }
    return { ok: true };
  });
  route('POST', '/api/power/loads', (m, q, b) => { const v = P(b, SPEC.load); mustRows(v, ['name']); const row = { id: nid('loads'), enabled: 1, note: null, ...v }; db.loads.push(row); return { id: row.id }; });
  route('PUT', '/api/power/loads/(\\d+)', (m, q, b) => { const v = P(b, SPEC.load); if (!Object.keys(v).length) err('no_fields'); Object.assign(findIn(db.loads, ID(m)), v); return { ok: true }; });
  route('DELETE', '/api/power/loads/(\\d+)', m => del(db.loads, ID(m)));
  route('PUT', '/api/power/forecast', (m, q, b) => {
    const day = String(b.day || '');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(day)) err('bad_day');
    if (b.condition == null || b.condition === '' || b.condition === 'default') delete db.forecast[day];
    else { if (!ENUM.condition.includes(b.condition)) err('constraint_failed'); db.forecast[day] = b.condition; }
    return { ok: true };
  });

  route('GET', '/api/devices', () => fleetOverview());
  route('POST', '/api/devices', (m, q, b) => { const v = P(b, SPEC.device); mustRows(v, ['name', 'kind']); const row = { id: nid('devices'), power_state: 'off', battery_pct: null, battery_health_pct: null, ...v, updated_at: nowIso() }; db.devices.push(row); return { id: row.id }; });
  route('PUT', '/api/devices/(\\d+)', (m, q, b) => { const v = P(b, SPEC.device); if (!Object.keys(v).length) err('no_fields'); Object.assign(findIn(db.devices, ID(m)), v, { updated_at: nowIso() }); return { ok: true }; });
  route('DELETE', '/api/devices/(\\d+)', m => {
    const id = ID(m); del(db.devices, id);
    db.sims.forEach(s => { if (s.device_id === id) s.device_id = null; });          // ON DELETE SET NULL
    db.schedules = db.schedules.filter(w => w.device_id !== id);                      // ON DELETE CASCADE
    return { ok: true };
  });
  route('GET', '/api/sims', () => simsOverview());
  route('POST', '/api/sims', (m, q, b) => { const v = P(b, SPEC.sim); mustRows(v, ['label', 'carrier']); const row = { id: nid('sims'), actual_state: 'off', device_id: null, ...v }; db.sims.push(row); return { id: row.id }; });
  route('PUT', '/api/sims/(\\d+)', (m, q, b) => { const v = P(b, SPEC.sim); if (!Object.keys(v).length) err('no_fields'); Object.assign(findIn(db.sims, ID(m)), v); return { ok: true }; });
  route('DELETE', '/api/sims/(\\d+)', m => { const id = ID(m); del(db.sims, id); db.schedules = db.schedules.filter(w => w.sim_id !== id); return { ok: true }; });
  const checkSched = r => { if (!((r.kind === 'sim_power' && r.sim_id != null) || (r.kind === 'hotspot' && r.device_id != null))) err('constraint_failed'); };
  route('POST', '/api/schedules', (m, q, b) => {
    const v = P(b, SPEC.sched); mustRows(v, ['kind', 'start_hhmm', 'end_hhmm']);
    const row = { id: nid('schedules'), sim_id: null, device_id: null, days: '1111111', enabled: 1, ...v }; checkSched(row);
    db.schedules.push(row); return { id: row.id };
  });
  route('PUT', '/api/schedules/(\\d+)', (m, q, b) => { const v = P(b, SPEC.sched); if (!Object.keys(v).length) err('no_fields'); const r = findIn(db.schedules, ID(m)); const next = { ...r, ...v }; checkSched(next); Object.assign(r, v); return { ok: true }; });
  route('DELETE', '/api/schedules/(\\d+)', m => del(db.schedules, ID(m)));

  route('GET', '/api/kb', () => kbList());
  route('GET', '/api/kb/search', (m, q) => kbSearch(q.q || ''));
  route('POST', '/api/kb/reindex', () => ({ added: 0, updated: 0, removed: 0, total: db.kb.length }));
  route('GET', '/api/kb/doc', (m, q) => {
    const d = db.kb.find(x => x.path === q.path) || err('not_found');
    const out = { path: d.path, kind: d.kind, title: d.title };
    if (d.kind === 'html') out.srcdoc = d.content; else out.content = d.content;
    return out;
  });

  route('GET', '/api/events', (m, q) => {
    const limit = Math.min(+q.limit || 100, 1000);
    return sortedEvents().filter(e => !q.kind || e.kind === q.kind).slice(0, limit).map(clone);
  });
  route('POST', '/api/events', (m, q, b) => {
    const kind = String(b.kind || 'note'); if (!ENUM.kind_ev.includes(kind)) err('constraint_failed');
    const row = { id: nid('events'), ts: String(b.ts || nowIso()), kind, value: null, unit: null, text: null, author: null };
    if (b.value !== undefined && b.value !== '' && b.value !== null) { row.value = Number(b.value); if (!Number.isFinite(row.value)) err('bad_number'); }
    for (const k of ['unit', 'text', 'author']) if (b[k]) row[k] = String(b[k]).slice(0, 500);
    db.events.push(row); return { id: row.id };
  });
  route('DELETE', '/api/events/(\\d+)', m => del(db.events, ID(m)));

  route('GET', '/api/checklists', () => checklistsOverview());
  route('PUT', '/api/phase', (m, q, b) => {
    const p = db.phases.find(x => x.level === Number(b.level)) || err('bad_level');
    db.settings.active_phase = String(p.level);
    db.events.push({ id: nid('events'), ts: nowIso(), kind: 'note', value: null, unit: null, text: `เปลี่ยนเฟสเป็น ${p.name}`, author: 'system' });
    return { ok: true };
  });
  route('POST', '/api/checklists/items/(\\d+)/toggle', m => { const i = findIn(db.items, ID(m)); i.done = i.done ? 0 : 1; i.done_at = i.done ? nowIso() : null; return { done: i.done }; });
  route('POST', '/api/checklists/items', (m, q, b) => {
    const level = Number(b.level), text = String(b.text || '').trim();
    if (!text) err('missing_text'); if (!db.phases.some(p => p.level === level)) err('bad_level');
    const seq = Math.max(0, ...db.items.filter(i => i.level === level).map(i => i.seq)) + 1;
    const row = { id: nid('items'), level, seq, text, done: 0, done_at: null }; db.items.push(row); return { id: row.id };
  });
  route('DELETE', '/api/checklists/items/(\\d+)', m => del(db.items, ID(m)));
  route('POST', '/api/checklists/(\\d)/reset', m => { db.items.forEach(i => { if (i.level === ID(m)) { i.done = 0; i.done_at = null; } }); return { ok: true }; });

  window.OFFROAD_API = async (path, method = 'GET', body) => {
    const url = new URL(path, 'http://x'), q = Object.fromEntries(url.searchParams);
    for (const [m, rx, fn] of R) {
      if (m !== method) continue;
      const match = rx.exec(url.pathname);
      if (!match) continue;
      const snapshot = method === 'GET' ? null : JSON.stringify(db);
      try {
        const out = fn(match, q, body || {});
        if (method !== 'GET') persist();
        return clone(out);
      } catch (e) {
        if (snapshot) db = JSON.parse(snapshot);                     // rollback เหมือน transaction ของ SQLite
        throw e;
      }
    }
    err('not_found');
  };

  // ───────────── เครื่องมือเสริมของโหมดไฟล์เดียว: คลังความรู้ + สำรอง/นำเข้า ─────────────
  const KB_EXT = { md: 'md', markdown: 'md', txt: 'txt', html: 'html', htm: 'html' };
  window.OFFROAD_KB_TOOLS = `<div class="kbtools"><button class="sm" data-local="kb-new">＋ สร้างเอกสาร<\/button>
    <button class="sm" data-local="kb-import">📥 นำเข้าไฟล์ (.md .txt .html)<\/button><\/div>`;
  window.OFFROAD_DOC_TOOLS = (path, kind) => `<div class="kbtools" style="margin:0 0 10px">
    ${kind === 'html' ? '' : `<button class="sm" data-local="kb-edit" data-path="${path.replace(/"/g, '&quot;')}">✎ แก้ไข<\/button>`}
    <button class="sm danger" data-local="kb-del" data-path="${path.replace(/"/g, '&quot;')}">🗑 ลบ<\/button><\/div>`;

  const toastMsg = (m, e) => (typeof toast === 'function' ? toast(m, e) : alert(m));
  const download = (name, text, type = 'application/json') => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  const pickFiles = (accept, multiple, cb) => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = accept; i.multiple = multiple;
    i.onchange = () => cb([...i.files]); i.click();
  };
  const refreshKb = async () => { await refreshDocList(); };   // ฟังก์ชันจาก app.js
  function saveDoc(path, title, content, kind) {
    const ex = db.kb.find(d => d.path === path);
    const category = path.includes('/') ? path.split('/')[0] : '';
    if (ex) Object.assign(ex, { title, content, kind }); else db.kb.push({ id: nid('kb'), path, title, kind, category, content });
    persist();
  }

  document.addEventListener('click', async ev => {
    const el = ev.target.closest('[data-local]'); if (!el) return;
    const a = el.dataset.local, path = el.dataset.path;
    try {
      if (a === 'kb-new') {
        const title = ((await askText('ชื่อเอกสารใหม่')) || '').trim(); if (!title) return;
        const p = 'my_notes/' + title.replace(/[\\/:*?"<>|]/g, '_') + '.md';
        if (db.kb.some(d => d.path === p)) return toastMsg('มีเอกสารชื่อนี้แล้ว', true);
        saveDoc(p, title, `# ${title}\n\n`, 'md'); await refreshKb(); await openDoc(p); startEdit(p);
      } else if (a === 'kb-import') {
        pickFiles('.md,.markdown,.txt,.html,.htm', true, async files => {
          let n = 0;
          for (const f of files) {
            const kind = KB_EXT[f.name.split('.').pop().toLowerCase()];
            if (!kind) { toastMsg(`ข้ามไฟล์ ${f.name} (รองรับเฉพาะ .md .txt .html)`, true); continue; }
            const content = await f.text(), p = 'imported/' + f.name;
            saveDoc(p, kind === 'md' ? kbTitle(content, p) : (/<title>([^<]+)/i.exec(content)?.[1] || f.name.replace(/\.[^.]+$/, '')), content, kind); n++;
          }
          if (n) { toastMsg(`นำเข้า ${n} ไฟล์แล้ว`); await refreshKb(); }
        });
      } else if (a === 'kb-edit') startEdit(path);
      else if (a === 'kb-del') {
        if (!(await ask('ลบเอกสารนี้?', 'ลบ'))) return;
        db.kb = db.kb.filter(d => d.path !== path); persist(); kb.path = null;
        $('#kb-view').innerHTML = '<p class="muted">เลือกเอกสารทางซ้าย<\/p>'; await refreshKb();
      } else if (a === 'backup') showBackup();
      else if (a === 'restore') showRestore();
      else if (a === 'reset') {
        if (await ask('ล้างข้อมูลทั้งหมดและเริ่มใหม่ด้วยข้อมูลตัวอย่าง? (แนะนำให้สำรองข้อมูลก่อน)', 'ล้างข้อมูล')) {
          try { localStorage.removeItem(KEY); } catch { /* ignore */ }
          db = JSON.parse(JSON.stringify(window.OFFROAD_SEED)); persist(); location.reload();
        }
      }
    } catch (e) { toastMsg('ผิดพลาด: ' + e.message, true); }
  });

  // สำรอง = คัดลอก JSON (ใช้ได้ทุกที่) หรือดาวน์โหลดไฟล์ (บางมุมมองบล็อกการดาวน์โหลด)
  function showBackup() {
    const text = JSON.stringify(db), d = new Date();
    const m = modal(`<form method="dialog"><p><b>สำรองข้อมูล<\/b><br><span class="small muted">คัดลอกข้อความนี้ไปเก็บในไฟล์ข้อความ/โน้ต หรือกดดาวน์โหลดเป็นไฟล์ .json
      (ถ้าปุ่มดาวน์โหลดไม่ทำงานในมุมมองนี้ ให้ใช้ปุ่มคัดลอก)<\/span><\/p>
      <textarea id="bk-text" readonly>${esc(text)}<\/textarea><div class="row gap end mt">
      <button type="button" id="bk-copy">คัดลอก<\/button><button type="button" id="bk-dl">ดาวน์โหลด .json<\/button>
      <button class="primary" value="close">ปิด<\/button><\/div><\/form>`);
    $('#bk-copy', m).onclick = async () => {
      try { await navigator.clipboard.writeText(text); toastMsg('คัดลอกแล้ว'); }
      catch { const t = $('#bk-text', m); t.select(); toastMsg('เลือกข้อความแล้ว กด Ctrl+C เพื่อคัดลอก'); }
    };
    $('#bk-dl', m).onclick = () => download(`offroad-backup-${ymd(d)}-${pad(d.getHours())}${pad(d.getMinutes())}.json`, text);
  }
  function showRestore() {
    const m = modal(`<form method="dialog"><p><b>นำเข้าข้อมูลสำรอง<\/b><br><span class="small muted">เลือกไฟล์ .json หรือวางข้อความที่สำรองไว้ แล้วกดนำเข้า (ข้อมูลปัจจุบันจะถูกแทนที่)<\/span><\/p>
      <input type="file" id="rs-file" accept=".json,application/json"><textarea id="rs-text" class="mt" placeholder="หรือวางข้อความ JSON ที่นี่"><\/textarea>
      <div class="row gap end mt"><button value="no">ยกเลิก<\/button><button type="button" class="primary" id="rs-go">นำเข้า<\/button><\/div><\/form>`);
    $('#rs-go', m).onclick = async () => {
      try {
        const f = $('#rs-file', m).files[0], data = JSON.parse(f ? await f.text() : $('#rs-text', m).value);
        if (!data || !Array.isArray(data.supplies) || !data.station || !Array.isArray(data.kb)) throw new Error('bad');
        m.close();
        if (!(await ask('แทนที่ข้อมูลปัจจุบันทั้งหมดด้วยข้อมูลสำรองนี้?', 'นำเข้า'))) return;
        db = data; persist(); location.reload();
      } catch { toastMsg('ข้อมูลสำรองไม่ถูกต้อง', true); }
    };
  }

  function startEdit(path) {
    const d = db.kb.find(x => x.path === path); if (!d) return;
    const el = $('#kb-view');
    el.innerHTML = `<div class="small muted">แก้ไข: ${esc(d.path)}<\/div>
      <textarea id="kb-edit" style="min-height:55vh;margin:8px 0;font-family:ui-monospace,Consolas,monospace">${esc(d.content)}<\/textarea>
      <div class="row gap"><button class="primary" id="kb-save">บันทึก<\/button><button id="kb-cancel">ยกเลิก<\/button><\/div>`;
    $('#kb-save').onclick = async () => {
      const content = $('#kb-edit').value; saveDoc(path, d.kind === 'md' ? kbTitle(content, path) : d.title, content, d.kind);
      toastMsg('บันทึกเอกสารแล้ว'); await refreshKb(); await openDoc(path);
    };
    $('#kb-cancel').onclick = () => openDoc(path);
  }

  // เมนูสำรอง/นำเข้า + สถานะการบันทึก
  function status() {
    const s = document.getElementById('persist-status'); if (!s) return;
    s.textContent = persistOK ? '💾 บันทึกในเบราว์เซอร์นี้' : '⚠ บันทึกถาวรไม่ได้ — ใช้ “สำรองข้อมูล”';
    s.style.color = persistOK ? '' : 'var(--warn)';
  }
  document.addEventListener('DOMContentLoaded', () => {
    const nav = document.getElementById('nav'); if (!nav) return;
    nav.insertAdjacentHTML('beforeend', `<div class="navtools"><div class="status" id="persist-status"><\/div>
      <button data-local="backup">⬇ สำรองข้อมูล (.json)<\/button><button data-local="restore">⬆ นำเข้าข้อมูล<\/button>
      <button data-local="reset" class="danger">⟲ รีเซ็ตเป็นข้อมูลตัวอย่าง<\/button><\/div>`);
    status();
  });
})();

</script>
<script>
'use strict';
/* Off Road web UI — vanilla JS, no external requests (works fully offline). */

// ───────────── helpers ─────────────
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* private mode */ } },
};
const CAT = { water: '💧 น้ำ', food: '🍱 อาหาร', gas: '🔥 แก๊ส', fuel: '⛽ เชื้อเพลิง' };
const COND = { sunny: '☀️ แดดจัด', partly: '⛅ มีเมฆบ้าง', cloudy: '☁️ เมฆมาก', rain: '🌧️ ฝน', storm: '⛈️ พายุ' };
const COND_ICON = { sunny: '☀️', partly: '⛅', cloudy: '☁️', rain: '🌧️', storm: '⛈️' };
const KIND = { phone: '📱 สมาร์ทโฟน', tablet: '📲 แท็บเล็ต', laptop: '💻 แล็ปท็อป', pc: '🖥️ PC' };
const PSTATE = { on: 'เปิด', off: 'ปิด', charging: 'กำลังชาร์จ', standby: 'สแตนด์บาย' };
const EVKIND = { water_gate: '🌊 น้ำหน้าบ้าน', water_indoor: '🏠 น้ำในบ้าน', breaker: '⚡ เบรกเกอร์', solar: '☀️ โซลาร์', power: '🔋 พลังงาน',
  supply: '📦 เสบียง', health: '🩹 สุขภาพ', comms: '📡 สื่อสาร', note: '📝 บันทึก' };
const EVUNIT = { water_gate: 'cm', water_indoor: 'cm', solar: 'Wh' };
const STATUS_CLS = { ok: 'ok', warn: 'warn', crit: 'crit', unknown: 'info' };

const num = (n, d = 0) => (n == null || isNaN(n)) ? '—' : Number(n).toLocaleString('th-TH', { maximumFractionDigits: d });
const fmtDays = d => d == null ? '∞' : d >= 10 ? String(Math.round(d)) : d.toFixed(1);
const hhmm = d => d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', hour12: false });
function when(iso) {            // เวลาสั้น ๆ; ถ้าไม่ใช่วันนี้ใส่วันที่ด้วย
  if (!iso) return '—';
  const d = new Date(iso), now = new Date();
  return d.toDateString() === now.toDateString() ? hhmm(d)
    : d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short' }) + ' ' + hhmm(d);
}
function ago(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 1 ? 'เมื่อสักครู่' : m < 60 ? `${m} นาทีที่แล้ว` : m < 1440 ? `${Math.floor(m / 60)} ชม.ที่แล้ว` : `${Math.floor(m / 1440)} วันที่แล้ว`;
}
const opts = (map, sel) => Object.entries(map).map(([k, v]) => `<option value="${k}"${k === sel ? ' selected' : ''}>${esc(v)}<\/option>`).join('');
const dayName = iso => new Date(iso + 'T00:00').toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric' });

// กล่องโต้ตอบในหน้า (แทน confirm/prompt ซึ่งบางตัวแสดงผลไม่ได้ เช่นใน Artifact viewer)
function modal(html) {
  const d = document.createElement('dialog');
  d.className = 'dlg'; d.innerHTML = html;
  d.addEventListener('close', () => d.remove());
  document.body.appendChild(d); d.showModal();
  return d;
}
function ask(msg, okLabel = 'ตกลง') {
  return new Promise(res => {
    const d = modal(`<form method="dialog"><p>${esc(msg)}<\/p><div class="row gap end">
      <button value="no">ยกเลิก<\/button><button class="primary" value="yes" autofocus>${esc(okLabel)}<\/button><\/div><\/form>`);
    d.addEventListener('close', () => res(d.returnValue === 'yes'));
  });
}
function askText(msg, value = '') {
  return new Promise(res => {
    const d = modal(`<form method="dialog"><p>${esc(msg)}<\/p><input class="wide" name="v" value="${esc(value)}" autocomplete="off">
      <div class="row gap end mt"><button value="no" formnovalidate>ยกเลิก<\/button><button class="primary" value="yes">ตกลง<\/button><\/div><\/form>`);
    d.addEventListener('close', () => res(d.returnValue === 'yes' ? d.querySelector('input').value : null));
    d.querySelector('input').focus();
  });
}

let toastTimer;
function toast(msg, err) {
  const t = $('#toast');
  t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = '', 2200);
}

async function api(path, method = 'GET', body, retried = false) {
  if (window.OFFROAD_API) return window.OFFROAD_API(path, method, body);   // โหมดไฟล์เดียว (ไม่มีเซิร์ฟเวอร์)
  const headers = {};
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  const pin = store.get('offroad_pin');
  if (pin) headers['X-Offroad-Pin'] = pin;
  const r = await fetch(path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
  if (r.status === 403 && !retried) {   // เครื่องอื่นใน LAN: ต้องใช้ PIN เพื่อแก้ไข
    const e = await r.json().catch(() => ({}));
    if (e.error === 'pin_required') {
      const p = await askText('ใส่ PIN เพื่อแก้ไขข้อมูล (ดูได้ที่หน้าจอโปรแกรมบนเครื่องหลัก)');
      if (p) { store.set('offroad_pin', p.trim()); return api(path, method, body, true); }
    }
    throw new Error(e.error || 'forbidden');
  }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || String(r.status));
  return r.json();
}

// ───────────── minimal Markdown renderer (escape-first, no raw HTML) ─────────────
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1<\/code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1<\/b>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2<\/i>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1<\/a>');
}
function md(src) {
  const L = src.replace(/\r/g, '').split('\n'), out = [];
  let list = null, i = 0;
  const close = () => { if (list) { out.push(`<\/${list}>`); list = null; } };
  const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
  while (i < L.length) {
    const l = L[i]; let m;
    if (/^```/.test(l)) {
      close(); const buf = []; i++;
      while (i < L.length && !/^```/.test(L[i])) buf.push(L[i++]);
      out.push('<pre><code>' + esc(buf.join('\n')) + '<\/code><\/pre>');
    } else if ((m = l.match(/^(#{1,3})\s+(.*)/))) {
      close(); out.push(`<h${m[1].length}>${inline(m[2])}<\/h${m[1].length}>`);
    } else if (/^\s*([-*_])\1{2,}\s*$/.test(l)) { close(); out.push('<hr>');
    } else if (/^>\s?/.test(l)) { close(); out.push('<blockquote>' + inline(l.replace(/^>\s?/, '')) + '<\/blockquote>');
    } else if (/^\s*\|.*\|\s*$/.test(l) && /^\s*\|[\s:|-]+\|\s*$/.test(L[i + 1] || '')) {
      close(); const head = cells(l); i += 2; const rows = [];
      while (i < L.length && /^\s*\|/.test(L[i])) rows.push(cells(L[i++]));
      i--;
      out.push('<div class="tablewrap"><table><tr>' + head.map(h => `<th>${inline(h)}<\/th>`).join('') + '<\/tr>'
        + rows.map(r => '<tr>' + r.map(c => `<td>${inline(c)}<\/td>`).join('') + '<\/tr>').join('') + '<\/table><\/div>');
    } else if ((m = l.match(/^\s*[-*]\s+(?:\[([ xX])\]\s+)?(.*)/))) {
      if (list !== 'ul') { close(); out.push('<ul>'); list = 'ul'; }
      out.push(m[1] === undefined ? `<li>${inline(m[2])}<\/li>` : `<li class="task">${/x/i.test(m[1]) ? '☑' : '☐'} ${inline(m[2])}<\/li>`);
    } else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) {
      if (list !== 'ol') { close(); out.push('<ol>'); list = 'ol'; }
      out.push(`<li>${inline(m[1])}<\/li>`);
    } else if (!l.trim()) { close();
    } else { close(); out.push('<p>' + inline(l) + '<\/p>'); }
    i++;
  }
  close();
  return out.join('\n');
}

// ───────────── view: dashboard ─────────────
const bar = (pct, cls = '') => `<div class="bar ${cls}"><i style="width:${Math.max(0, Math.min(100, pct))}%"><\/i><\/div>`;

function phaseCard(d) {
  const p = d.phase;
  return `<section class="card span2">
    <h2>สถานการณ์ปัจจุบัน<\/h2>
    <div class="row wrap between">
      <div class="row wrap">
        <span class="flag ${p.flag}">⚑ ${esc(p.name)}<\/span>
        <span class="muted">${esc(p.summary)}<\/span>
      <\/div>
      <div class="row gap">${[1, 2, 3].map(n => `<button class="seg ${n === p.level ? 'on' : ''}" data-flag="${['yellow', 'orange', 'red'][n - 1]}"
        data-act="phase" data-level="${n}">ระดับ ${n}<\/button>`).join('')}<\/div>
    <\/div>
    <div class="row mt gap"><div style="flex:1">${bar(p.total ? 100 * p.done / p.total : 0, 'info')}<\/div>
      <a href="#log" class="small">Checklist ${p.done}/${p.total}<\/a><\/div>
  <\/section>`;
}

function powerCard(d) {
  const p = d.power, pct = p.soc_pct, cls = pct < 20 ? 'crit' : pct < 40 ? 'warn' : '';
  const dr = p.days_remaining;
  const drCls = p.sustainable ? 'ok' : dr < 1 ? 'crit' : dr < 3 ? 'warn' : 'ok';
  const net = p.days[0] ? p.days[0].solar_wh - p.burn_wh_day : 0;
  return `<section class="card"><h2>🔋 พลังงาน <a href="#power" class="small">จัดการ<\/a><\/h2>
    <div class="row gap">
      <div class="ring ${cls}"><svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="54" fill="none" stroke-width="10"/>

// ───────────── view: knowledge base ─────────────
const kb = { q: '', path: null };
function docList(items, searching) {
  if (!items.length) return `<p class="muted">${searching ? 'ไม่พบผลลัพธ์' : 'ยังไม่มีเอกสาร — วางไฟล์ใน knowledge/ แล้วกด “สแกนใหม่”'}<\/p>`;
  let last = null, out = '';
  for (const d of items) {
    if (!searching && d.category !== last) { out += `<div class="small muted" style="margin-top:10px">📁 ${esc(d.category || 'ทั่วไป')}<\/div>`; last = d.category; }
    const snip = d.snip ? `<span class="snip">${esc(d.snip).replace(/\x02/g, '<mark>').replace(/\x03/g, '<\/mark>')}<\/span>` : '';
    out += `<button class="doclink ${d.path === kb.path ? 'active' : ''}" data-act="open-doc" data-path="${esc(d.path)}">
      ${esc(d.title)} <span class="chip">${d.kind}<\/span>${snip}<\/button>`;
  }
  return out;
}
async function refreshDocList() {
  const el = $('#kb-list'); if (!el) return;
  const items = kb.q.trim() ? await api('/api/kb/search?q=' + encodeURIComponent(kb.q)) : await api('/api/kb');
  el.innerHTML = docList(items, !!kb.q.trim());
}
async function openDoc(path) {
  kb.path = path;
  const el = $('#kb-view');
  const url = '/kb-files/' + path.split('/').map(encodeURIComponent).join('/');
  const doc = await api('/api/kb/doc?path=' + encodeURIComponent(path));
  if (doc.kind === 'md') el.innerHTML = `<div class="md">${md(doc.content)}<\/div>`;
  else if (doc.kind === 'txt') el.innerHTML = `<pre style="white-space:pre-wrap">${esc(doc.content)}<\/pre>`;
  else if (doc.srcdoc != null) el.innerHTML = `<iframe class="doc" sandbox="allow-popups" srcdoc="${esc(doc.srcdoc)}" title="${esc(doc.title)}"><\/iframe>`;
  else el.innerHTML = `<iframe class="doc" src="${url}" ${doc.kind === 'html' ? 'sandbox="allow-popups"' : ''} title="${esc(doc.title)}"><\/iframe>
    <p class="small"><a href="${url}" target="_blank">เปิดในแท็บใหม่<\/a><\/p>`;
  if (window.OFFROAD_DOC_TOOLS) el.insertAdjacentHTML('afterbegin', window.OFFROAD_DOC_TOOLS(path, doc.kind));
  refreshDocList();
}
async function viewKnowledge() {
  return { title: 'คลังความรู้', html: `<div class="kbgrid"><section class="card">
      <div class="row gap"><input id="kb-q" class="wide" type="search" placeholder="ค้นหาในเอกสารทั้งหมด…" value="${esc(kb.q)}">
        <button class="sm js-reindex" data-act="reindex" title="สแกนโฟลเดอร์ knowledge/ ใหม่">⟳<\/button><\/div>
      ${window.OFFROAD_KB_TOOLS || ''}
      <div id="kb-list" class="mt"><\/div><\/section>
      <section class="card" id="kb-view"><p class="muted">เลือกเอกสารทางซ้าย<\/p><\/section><\/div>`,
    after: async () => { await refreshDocList(); if (kb.path) openDoc(kb.path).catch(() => { kb.path = null; }); } };
}

// ───────────── view: log & checklists ─────────────
const logState = { phase: null, filter: '' };
async function viewLog() {
  const [chk, ev] = await Promise.all([api('/api/checklists'), api('/api/events?limit=200' + (logState.filter ? '&kind=' + logState.filter : ''))]);
  const lv = logState.phase || chk.active, ph = chk.phases.find(p => p.level === lv);
  return { title: 'บันทึก & Checklist', html: `<div class="grid wide">
    <section class="card"><h2>Checklist ตามระดับ<\/h2>
      <div class="row gap wrap">${chk.phases.map(p => `<button class="seg ${p.level === lv ? 'on' : ''}" data-flag="${p.flag}" data-act="log-phase" data-level="${p.level}">
        ${esc(p.name)} (${p.done}/${p.total})<\/button>`).join('')}<\/div>
      <div class="row between mt"><span class="muted small">${esc(ph.summary)}${lv === chk.active ? ' · <b>ระดับปัจจุบัน<\/b>' : ''}<\/span>
        <span><button class="sm" data-act="reset-checklist" data-level="${lv}">รีเซ็ต<\/button><\/span><\/div>
      <div class="mt">${ph.items.map(i => `<div class="check ${i.done ? 'done' : ''}"><input type="checkbox" ${i.done ? 'checked' : ''} data-act="toggle-item" data-id="${i.id}">
        <span class="t" data-act="toggle-item" data-id="${i.id}">${esc(i.text)}${i.done_at ? ` <span class="small muted">· ${when(i.done_at)}<\/span>` : ''}<\/span>
        <button class="sm danger" data-act="del" data-url="/api/checklists/items/${i.id}" data-noconfirm="1">✕<\/button><\/div>`).join('')}<\/div>
      <form class="inline mt" data-post="/api/checklists/items" data-toast="เพิ่มข้อแล้ว"><input type="hidden" name="level" value="${lv}">
        <input name="text" style="flex:1" placeholder="เพิ่มข้อใหม่ในระดับนี้…" required><button class="primary">เพิ่ม<\/button><\/form><\/section>
    <section class="card"><h2>บันทึกเหตุการณ์ (Timeline)<\/h2>
      <form class="inline" data-post="/api/events" data-toast="บันทึกแล้ว"><select name="kind">${opts(EVKIND, 'note')}<\/select>
        <input type="number" name="value" step="any" placeholder="ค่า" style="width:80px"><input name="unit" placeholder="หน่วย" style="width:64px">
        <input name="text" placeholder="รายละเอียด" style="flex:1;min-width:140px"><button class="primary">บันทึก<\/button><\/form>
      <div class="row gap mt"><span class="small muted">กรอง<\/span><select data-act="log-filter"><option value="">ทั้งหมด<\/option>${opts(EVKIND, logState.filter)}<\/select><\/div>
      <ul class="list">${ev.map(e => `<li><time>${when(e.ts)}<\/time><span class="grow">${EVKIND[e.kind] || ''}
        ${e.value != null ? `<b>${num(e.value, 1)} ${esc(e.unit || '')}<\/b>` : ''} ${esc(e.text || '')}<\/span>
        <button class="sm danger" data-act="del" data-url="/api/events/${e.id}">✕<\/button><\/li>`).join('')}<\/ul><\/section><\/div>` };
}

// ───────────── router / render ─────────────
const VIEWS = { dashboard: viewDashboard, supplies: viewSupplies, power: viewPower, fleet: viewFleet, knowledge: viewKnowledge, log: viewLog };
let current = 'dashboard';

async function render() {
  current = VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : 'dashboard';
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('active', a.dataset.v === current));
  const y = scrollY;
  try {
    const v = await VIEWS[current]();
    $('#app').innerHTML = `<header class="top"><h1>${esc(v.title)}<\/h1><span class="spacer"><\/span><span class="clock"><\/span><\/header>${v.html}`;
    tick(); scrollTo(0, y);
    if (v.after) await v.after();
  } catch (e) {
    $('#app').innerHTML = `<div class="card crit">โหลดข้อมูลไม่สำเร็จ: ${esc(e.message)}<\/div>`;
  }
}
function tick() {
  const c = $('.clock');
  if (c) c.textContent = new Date().toLocaleString('th-TH', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false });
}

async function run(fn, okMsg) {
  try { await fn(); if (okMsg) toast(okMsg); await render(); } catch (e) { toast('ผิดพลาด: ' + e.message, true); }
}

// ───────────── events (delegated) ─────────────
const app = $('#app');

app.addEventListener('change', ev => {
  const el = ev.target;
  if (el.dataset.edit) {
    const v = el.type === 'checkbox' ? (el.checked ? 1 : 0) : el.type === 'number' ? (el.value === '' ? null : Number(el.value)) : el.value;
    run(() => api(el.dataset.edit, 'PUT', { [el.dataset.field]: v }), 'บันทึกแล้ว');
  } else if (el.dataset.forecast) {
    run(() => api('/api/power/forecast', 'PUT', { day: el.dataset.forecast, condition: el.value }));
  } else if (el.dataset.act === 'log-filter') {
    logState.filter = el.value; render();
  } else if (el.name === 'kind' && el.form?.elements.unit && el.form.dataset.post === '/api/events') {
    el.form.elements.unit.value = EVUNIT[el.value] || '';
  }
});

app.addEventListener('input', ev => {
  if (ev.target.id !== 'kb-q') return;
  kb.q = ev.target.value;
  clearTimeout(kb.timer); kb.timer = setTimeout(refreshDocList, 250);
});


app.addEventListener('submit', ev => {
  const f = ev.target;
  if (!f.dataset.post) return;
  ev.preventDefault();
  const body = Object.fromEntries(new FormData(f));
  run(() => api(f.dataset.post, 'POST', body), f.dataset.toast);
});

app.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]');
  if (!el || el.tagName === 'SELECT' || (el.type === 'checkbox' && ev.target !== el)) return;
  const d = el.dataset;
  switch (d.act) {
    case 'phase':
      if (await ask('เปลี่ยนระดับสถานการณ์เป็นระดับ ' + d.level + ' ?')) run(() => api('/api/phase', 'PUT', { level: +d.level }), 'เปลี่ยนระดับแล้ว');
      break;
    case 'adjust': {
      const v = parseFloat($('#amt-' + d.id).value);
      if (!(v > 0)) return toast('ใส่จำนวนก่อน', true);
      run(() => api(`/api/supplies/${d.id}/adjust`, 'POST', { delta: v * +d.sign }), 'อัปเดตยอดแล้ว');
      break;
    }
    case 'del':
      if (d.noconfirm || await ask('ลบรายการนี้?', 'ลบ')) run(() => api(d.url, 'DELETE'));
      break;
    case 'toggle-item': run(() => api(`/api/checklists/items/${d.id}/toggle`, 'POST', {})); break;
    case 'reset-checklist':
      if (await ask('ล้างเครื่องหมายทั้งหมดในระดับนี้?')) run(() => api(`/api/checklists/${d.level}/reset`, 'POST', {}), 'รีเซ็ตแล้ว');
      break;
    case 'log-phase': logState.phase = +d.level; render(); break;
    case 'open-doc': openDoc(d.path).catch(e => toast(e.message, true)); break;
    case 'reindex':
      api('/api/kb/reindex', 'POST', {}).then(r => { toast(`สแกนแล้ว: ${r.total} ไฟล์ (+${r.added} ~${r.updated} −${r.removed})`); refreshDocList(); })
        .catch(e => toast(e.message, true));
      break;
  }
});

window.addEventListener('hashchange', render);
// รีเฟรชแดชบอร์ดอัตโนมัติทุก 30 วิ เฉพาะเมื่อแท็บมองเห็นอยู่และไม่ได้กำลังพิมพ์ (ประหยัด CPU/แบต)
setInterval(() => {
  if (document.hidden) return;
  tick();
  if (current === 'dashboard' && !/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName)) render();
}, 30000);
render();

</script>
</body>
</html>
